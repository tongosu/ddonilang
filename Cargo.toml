# ddonirang/Cargo.toml
[workspace]
members = [
    "core",
    "lang",
    "numeric",
    "proof",
    "symbolic",
    "tool",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package.ddonirang-tool]
# Interactive Alpha2 execution prioritizes runtime speed over minimum binary size.
# World/receipt/tape equivalence is checked against the previous size build.
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
debug = true
