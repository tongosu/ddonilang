# ddonilang/0단계/tool/Cargo.toml

[package]
name = "ddonirang-tool"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ddonilang"
path = "src/bin/ddonirang.rs"

[[bin]]
name = "또니랑"
path = "src/bin/ddonirang.rs"

[[bin]]
name = "ddonirang"
path = "src/bin/ddonirang.rs"

[features]
default = ["internal-tools"]
# Internal SSOT/prompt management is not part of the public runtime build.
internal-tools = []
# Owner D10/G1-B: retained development paths, excluded from alpha builds.
beta-project-features = []
wasm = ["wasm-bindgen", "js-sys", "web-sys"]

[[bin]]
name = "ddonirang-tool"
path = "src/main.rs"
required-features = ["internal-tools"]

[dependencies]
# 이전 설계 가이드에서 드린 의존성들을 여기에 적습니다
blake3 = "1.5"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
libm = "0.2"
regex = "1.11"
getrandom = { version = "0.3", features = ["wasm_js"] }
unicode-normalization = "0.1"
# Owner 승인: 공통 CLI/WASM 글 선택의 Unicode grapheme 경계를 고정한다.
unicode-segmentation = "=1.13.3"
num-bigint = "0.4"
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console", "XmlHttpRequest"] }

# 다른 크레이트와의 연결 (경로가 실제 폴더명과 일치해야 함)
ddonirang-lang = { path = "../lang" }
ddonirang-core = { path = "../core" }
ddonirang-numeric = { path = "../numeric" }
ddonirang-proof = { path = "../proof" }
ddonirang-symbolic = { path = "../symbolic" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.27"
zip = "0.6"
# Owner 2026-10-12: official Cargo download and locked native SQLite dependency.
# No system SQLite DLL or browser durability claim; transitive versions are locked.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
